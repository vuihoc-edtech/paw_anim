name: paw_anim
description: "Reusable paw reward animation widgets for VUIHOC."
version: 0.0.1
homepage:

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_svg:
  lottie:

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  assets:
    - assets/cat_paws.svg
    - assets/cat_paws_white.svg
    - assets/confetti.json
    - assets/illustration_effects.json
    - assets/bitu_reward_illustration.png
    - assets/fonts/SVN-Merge-Regular.otf
    - assets/fonts/SVN-Merge-Bold.otf
  fonts:
    - family: SVN-Merge
      fonts:
        - asset: assets/fonts/SVN-Merge-Regular.otf
          weight: 400
        - asset: assets/fonts/SVN-Merge-Bold.otf
          weight: 700
